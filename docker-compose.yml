services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      assistant_api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/nginx/auth:/etc/nginx/auth:ro

  assistant_api:
    build:
      context: .
      dockerfile: services/assistant_api/Dockerfile
    environment:
      GARMIN_USERNAME: ${GARMIN_USERNAME:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      GARMIN_SESSION_STORAGE_PATH: ${GARMIN_SESSION_STORAGE_PATH:-/app/.garmin/tokens}
      GARMIN_CREDENTIAL_ENCRYPTION_KEY: ${GARMIN_CREDENTIAL_ENCRYPTION_KEY:-}
      GARMIN_SESSION_STORAGE_ROOT: ${GARMIN_SESSION_STORAGE_ROOT:-/data/garmin-sessions}
      REDACT_PII: ${REDACT_PII:-true}
      GARMIN_COMPACT_ACTIVITY_PAYLOAD: ${GARMIN_COMPACT_ACTIVITY_PAYLOAD:-false}
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      REGION: ${REGION:-}
      OCI_MODEL_ID: ${OCI_MODEL_ID:-openai.gpt-5.4}
      NUTRITION_DB_PATH: ${NUTRITION_DB_PATH:-/data/garmin_ai_coach.db}
      APP_DB_PATH: ${APP_DB_PATH:-/data/garmin_ai_coach.db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - garmin-session:/app/.garmin
      - assistant-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      ASSISTANT_API_URL: http://assistant_api:8000
      NEXT_PUBLIC_ASSISTANT_API_URL: http://assistant_api:8000
    depends_on:
      assistant_api:
        condition: service_healthy

volumes:
  garmin-session:
  assistant-data:
